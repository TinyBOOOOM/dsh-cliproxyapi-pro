# Release a tag `v<version>` that matches package.json:
#   1. run the checks,
#   2. create a GitHub Release with the packed bundle attached twice:
#      `dsh-cliproxyapi-pro-<version>.tgz` and the version-free
#      `dsh-cliproxyapi-pro.tgz` (stable `releases/latest/download/` URL),
#   3. publish to npm with provenance — only when the `NPM_TOKEN`
#      repository secret is set; otherwise the step is skipped.
#
# Runs on a pushed tag, or by hand (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f tag=v1.4.0`) to finish an existing tag.
# Every step is idempotent: an existing Release and an npm version that is
# already published are left alone, so a re-run only does what is missing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.4.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Inputs reach scripts only through env, never inline in `run:`.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a version tag like v1.4.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "PACKAGE=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - name: Syntax check and tests
        run: npm run check

      - name: Pack
        run: |
          npm pack
          cp "${PACKAGE}-${VERSION}.tgz" "${PACKAGE}.tgz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged"
            exit 0
          fi
          notes="$(awk -v v="## ${VERSION}" 'index($0, v) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
          gh release create "${TAG}" \
            "${PACKAGE}-${VERSION}.tgz" \
            "${PACKAGE}.tgz" \
            --title "${TAG}" \
            --notes "${notes:-See CHANGELOG.md}"

      - name: Decide npm publish
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set; skipping npm publish"
          elif npm view "${PACKAGE}@${VERSION}" version > /dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on npm; skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
